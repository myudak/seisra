worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    sendfile on;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # Docker's DNS, so the web container starts even if a backend is still down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        root /usr/share/nginx/html;
        client_max_body_size 20m;

        # Same paths the Vite dev proxy uses (see vite.config.ts), so the
        # frontend never needs a hard-coded server address.
        location /api/ {
            set $api http://api:8003;
            proxy_pass $api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /record-api/ {
            set $record http://record-stream:8001;
            rewrite ^/record-api/(.*)$ /$1 break;
            proxy_pass $record;
        }

        location /socket.io/ {
            set $waveform http://ws-waveform:8004;
            proxy_pass $waveform;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
        }

        location ~ ^/ws(event|picking|arrivalpick)$ {
            set $general http://ws-general:8005;
            proxy_pass $general;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
